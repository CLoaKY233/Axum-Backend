[package]
name = "axum_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Workspace dependencies
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
chrono.workspace = true

# Our crates
err.workspace = true
env.workspace = true
hlt.workspace = true
log.workspace = true
# Other dependencies
async-trait = "0.1.89"

dotenvy = "0.15.7"
futures = "0.3.31"
ssh2 = "0.9.5"
surrealdb = "2.3.10"
tower-http = { version = "0.6.6", features = ["trace", "request-id"] }

[dev-dependencies]
serial_test = "3.2.0"







[workspace]
resolver = "3"
members = ["crates/env", "crates/err", "crates/hlt", "crates/log"]


# Shared dependencies across all crates
[workspace.dependencies]
axum = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = "0.4.42"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
err = { path = "crates/err" }
env = { path = "crates/env" }
hlt = { path = "crates/hlt" }
log = { path = "crates/log" }

# Profile settings apply to entire workspace
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
