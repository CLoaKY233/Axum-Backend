[workspace]
resolver = "2"
members = [
    "crates/err",
]

# Shared dependencies across all crates
[workspace.dependencies]
axum = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

# Profile settings apply to entire workspace
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
